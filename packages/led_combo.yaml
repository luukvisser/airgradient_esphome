                condition:
                  lambda: 'return !isnan(id(co2).state);'
                then:
                  - light.addressable_set:
                      id: led_strip
                      range_from: 0
                      range_to: 10
                      color_brightness: 100%
                      red: 0%
                      green: 0%
                      blue: 0%
                  - light.addressable_set:
                      id: led_strip
                      range_from: !lambda |-
                        int n = std::max(1, std::min(11, 2 + (int)((id(co2).state - 600.0f) / 100.0f)));
                        return 11 - n;
                      range_to: 10
                      color_brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                      red: !lambda |-
                        float raw = id(co2).state;
                        float x = (raw < $co2_green) ? raw : $co2_green + floorf((raw - $co2_green) / 50.0f) * 50.0f;
                        return (x < $co2_green) ? 0.0f : (x <= $co2_yellow) ? (x - $co2_green) / ($co2_yellow - $co2_green) : 1.0f;
                      green: !lambda |-
                        float x = id(co2).state;
                        x = (x < $co2_green) ? x : $co2_green + floorf((x - $co2_green) / 50.0f) * 50.0f;
                        if (x < $co2_green)  return 1.0f;
                        if (x < $co2_yellow) return 1.0f - 0.25f * (x - $co2_green) / ($co2_yellow - $co2_green);
