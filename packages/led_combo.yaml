                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x <= $pm_2_5_bar_green) return 0.0f;
                        if (x <= $pm_2_5_bar_yellow) return (x - $pm_2_5_bar_green) / ($pm_2_5_bar_yellow - $pm_2_5_bar_green);
                        return 1.0f;
                      green: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x <= $pm_2_5_bar_green)  return 1.0f;
                        if (x < $pm_2_5_bar_yellow)  return 1.0f - 0.25f * (x - $pm_2_5_bar_green) / ($pm_2_5_bar_yellow - $pm_2_5_bar_green);
                        if (x <= $pm_2_5_bar_orange) return 0.75f - 0.25f * (x - $pm_2_5_bar_yellow) / ($pm_2_5_bar_orange - $pm_2_5_bar_yellow);
                        if (x <= $pm_2_5_bar_red)    return 0.5f - 0.5f * (x - $pm_2_5_bar_orange) / ($pm_2_5_bar_red - $pm_2_5_bar_orange);
                        return 0.0f;
                      blue: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x < $pm_2_5_bar_red) return 0.0f;
                        if (x <= $pm_2_5_bar_purple) return (x - $pm_2_5_bar_red) / ($pm_2_5_bar_purple - $pm_2_5_bar_red);
                        return 1.0f;
                  - if:
                      condition:
                        lambda: |-
                          float pm = std::max(0.0f, id(pm_2_5).state);
                          int n = std::max(1, std::min(11, 1 + (int)floorf(pm / 2.5f)));
                          float band_pos = pm - floorf(pm / 2.5f) * 2.5f;
                          return n < 11 && band_pos >= 1.25f;
                      then:
                        - light.addressable_set:
                            id: led_strip
                            range_from: !lambda |-
                              float pm = std::max(0.0f, id(pm_2_5).state);
                              int n = std::max(1, std::min(11, 1 + (int)floorf(pm / 2.5f)));
                              return 11 - n - 1;
                            range_to: !lambda |-
                              float pm = std::max(0.0f, id(pm_2_5).state);
                              int n = std::max(1, std::min(11, 1 + (int)floorf(pm / 2.5f)));
                              return 11 - n - 1;
                            color_brightness: !lambda |-
                              // Half-power preview LED. Off below 30% brightness;
                              // from 30% to 100% the preview's color_brightness
                              // scales linearly from 0.25 up to 0.50.
                              float b = id(led_brightness).state;
                              if (b < 30.0f) return 0.0f;
                              return 0.25f + (b - 30.0f) * (0.50f - 0.25f) / (100.0f - 30.0f);
                            red: !lambda |-
                              float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                              if (x <= $pm_2_5_bar_green) return 0.0f;
                              if (x <= $pm_2_5_bar_yellow) return (x - $pm_2_5_bar_green) / ($pm_2_5_bar_yellow - $pm_2_5_bar_green);
                              return 1.0f;
                            green: !lambda |-
                              float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                              if (x <= $pm_2_5_bar_green)  return 1.0f;
                              if (x < $pm_2_5_bar_yellow)  return 1.0f - 0.25f * (x - $pm_2_5_bar_green) / ($pm_2_5_bar_yellow - $pm_2_5_bar_green);
                              if (x <= $pm_2_5_bar_orange) return 0.75f - 0.25f * (x - $pm_2_5_bar_yellow) / ($pm_2_5_bar_orange - $pm_2_5_bar_yellow);
                              if (x <= $pm_2_5_bar_red)    return 0.5f - 0.5f * (x - $pm_2_5_bar_orange) / ($pm_2_5_bar_red - $pm_2_5_bar_orange);
                              return 0.0f;
                            blue: !lambda |-
                              float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                              if (x < $pm_2_5_bar_red) return 0.0f;
                              if (x <= $pm_2_5_bar_purple) return (x - $pm_2_5_bar_red) / ($pm_2_5_bar_purple - $pm_2_5_bar_red);
                              return 1.0f;
            - if:
                condition:
                  lambda: 'return isnan(id(pm_2_5).state);'
                then:
                  - light.addressable_set:
                      id: led_strip
                      range_from: 0
                      range_to: 10
                      color_brightness: 100%
                      red: 0%
                      green: 0%
                      blue: 0%
      # ── Left LED notification override (HA-triggered, temporary) ──────────
      # Painted last so it wins over every mode above. Persists across the 5 s
      # interval repaint until left_led_override clears the flag. Uses the bar's
      # led_brightness and the hue from the left_led_color light. Skipped in Off
      # mode so it never fights a bar the user has switched off.
      - if:
          condition:
            lambda: 'return id(left_led_override_active) && id(led_mode).current_option()
              != "Off";'
          then:
            - light.addressable_set:
                id: led_strip
                range_from: 0
                range_to: 0
                color_brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                red: !lambda 'return id(left_led_color).current_values.get_red();'
                green: !lambda 'return id(left_led_color).current_values.get_green();'
                blue: !lambda 'return id(left_led_color).current_values.get_blue();'
