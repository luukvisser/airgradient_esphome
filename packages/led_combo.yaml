# Multi-mode LED indicator with HA/web-UI mode selector.
#
# Modes:
#   5CO2+5PM2.5+1VOC — Left 5 LEDs: CO2 | Middle 5 LEDs: PM2.5 | Right 1 LED: TVOC
#   5CO2+5PM2.5      — Left 5 LEDs: CO2 | Middle 5 LEDs: PM2.5 | LED 10 off
#   5CO2+3PM25+1VOC  — LEDs 1-5: CO2 | LEDs 6-8: PM2.5 | LED 10: VOC
#   CO2        — All 11 LEDs: CO2
#   PM2.5      — All 11 LEDs: PM2.5
#   VOC        — All 11 LEDs: VOC index
#   CO2 Bar    — Bar fills right→left: 1 LED below 600 ppm, 2 LEDs at 600 ppm, all 11 at ≥1500 ppm
#   PM2.5 Bar  — Bar fills right→left: right LED on at <5 µg/m³, all on at ~150 µg/m³
#   Test       — All LEDs on at full brightness (for testing)
#   Off        — All LEDs off
---
# Color thresholds: CO2 follows ASHRAE/UBA indoor ventilation guidance;
# PM2.5 follows 2021 WHO air quality guidelines; VOC follows Sensirion SGP41
# index interpretation (100 = learned baseline for this environment).
substitutions:
  co2_green: '600' # Well-ventilated indoor air
  co2_yellow: '900' # Slightly elevated, still comfortable
  co2_orange: '1000' # Ventilation recommended
  co2_red: '1200' # Poor air quality; open a window
  co2_purple: '1500' # Unacceptable; noticeable drowsiness/headaches possible
  # PM2.5 thresholds, compressed to 0–25 µg/m³ so the full green→purple gradient
  # is visible across the bar's display range. Shared by every PM2.5 view (solid
  # PM2.5 mode, the combo modes, and PM2.5 Bar).
  pm_2_5_bar_green: '0' # Bar start (rightmost LED): very clean air
  pm_2_5_bar_yellow: '5' # WHO annual guideline
  pm_2_5_bar_orange: '10' # Midrange
  pm_2_5_bar_red: '15' # WHO 24-hour guideline
  pm_2_5_bar_purple: '25' # Bar end (all LEDs on): all LEDs lit
  voc_green: '175' # Baseline — clean indoor air (175–199 fully green, ≥200 starts yellow)
  voc_yellow: '225' # Slight VOC elevation
  voc_orange: '300' # Notable VOC event in progress
  voc_red: '375' # Sustained VOC event; ventilate
  voc_purple: '475' # Extreme (near top of SGP41 scale)
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: 'id(leds_ready) = true;'
        - script.execute: update_leds
# Gate for early-boot safety. The select + number restore_value hooks fire
# during component setup, before esp32_rmt_led_strip has allocated its LED
# buffer — painting then crashes with a null pointer in ESPColorView::set_red.
globals:
  - id: leds_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  # Set true while the HA-triggered left-LED notification override is active.
  # update_leds paints LED 0 with left_led_color as its final step whenever
  # this is true, so the override survives the recurring 5 s repaint.
  - id: left_led_override_active
    type: bool
    restore_value: false
    initial_value: 'false'
# Virtual RGB "color holder" for the left-LED notification override. It exposes
# a normal HA color light (default white) whose chosen hue is read by update_leds;
# it drives no hardware, so it is backed by no-op template outputs. Brightness is
# taken from led_brightness (not this light), so only the hue here matters.
output:
  - platform: template
    id: left_led_color_r
    type: float
    write_action:
      - lambda: '' # no-op; value is held in the light state, not driven anywhere
  - platform: template
    id: left_led_color_g
    type: float
    write_action:
      - lambda: ''
  - platform: template
    id: left_led_color_b
    type: float
    write_action:
      - lambda: ''
light:
  - platform: rgb
    name: "Left LED Notification Color"
    id: left_led_color
    icon: "mdi:palette"
    red: left_led_color_r
    green: left_led_color_g
    blue: left_led_color_b
    restore_mode: RESTORE_DEFAULT_ON # Default = white
    entity_category: config
    web_server:
      sorting_group_id: grp_led
select:
  - platform: template
    name: "LED Mode"
    id: led_mode
    icon: "mdi:led-strip-variant"
    optimistic: true
    restore_value: true
    initial_option: "CO2 Bar"
    options:
      - "5CO2+5PM2.5+1VOC"
      - "5CO2+5PM2.5"
      - "5CO2+3PM25+1VOC"
      - "CO2"
      - "PM2.5"
      - "VOC"
      - "CO2 Bar"
      - "PM2.5 Bar"
      - "GO IAQS"
      - "Test"
      - "Off"
    entity_category: config
    web_server:
      sorting_group_id: grp_led
    on_value:
      - if:
          condition:
            lambda: 'return id(leds_ready);'
          then:
            # Turn on (or off) the strip when the mode changes, before painting.
            - if:
                condition:
                  lambda: 'return id(led_mode).current_option() != "Off";'
                then:
                  - light.turn_on:
                      id: led_strip
                      transition_length: 0s
            - if:
                condition:
                  lambda: 'return id(led_mode).current_option() == "Off";'
                then:
                  - light.turn_off: led_strip
            - script.execute: update_leds
number:
  - id: !extend led_brightness
    on_value:
      - if:
          condition:
            lambda: 'return id(leds_ready);'
          then:
            - script.execute: update_leds
  - id: !extend led_fade
    on_value:
      - if:
          condition:
            lambda: 'return id(leds_ready);'
          then:
            - script.execute: update_leds
  # How long the left-LED notification override stays lit after the button is
  # pressed, in seconds. Read by the left_led_override script's delay.
  - platform: template
    name: "Left LED Notification Duration"
    id: left_led_duration
    icon: "mdi:timer"
    min_value: 1
    max_value: 300
    step: 1
    initial_value: 60
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    web_server:
      sorting_group_id: grp_led
button:
  # HA-triggerable notification: lights the leftmost LED (index 0) with
  # left_led_color for left_led_duration seconds, then returns to normal
  # operation. Fired from Home Assistant automations via button.press.
  - platform: template
    name: "Left LED Notification"
    id: left_led_notify_button
    icon: "mdi:bell-ring"
    entity_category: config
    web_server:
      sorting_group_id: grp_led
    on_press:
      - script.execute: left_led_override
script:
  # Temporary left-LED notification overlay. mode: restart so a re-press
  # restarts the timer. Respects Off mode — does nothing while the bar is Off.
  - id: left_led_override
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(leds_ready) && id(led_mode).current_option() != "Off";'
          then:
            - lambda: 'id(left_led_override_active) = true;'
            - script.execute: update_leds # Paint LED 0 immediately
            - delay: !lambda 'return (uint32_t)(id(left_led_duration).state * 1000);'
            - lambda: 'id(left_led_override_active) = false;'
            - script.execute: update_leds # Restore normal operation
  - id: update_leds
    then:
      # ── Off ──────────────────────────────────────────────────────────────
      - if:
          condition:
            lambda: 'return id(led_mode).current_option() == "Off";'
          then:
            - light.turn_off: led_strip
      # ── Test ─────────────────────────────────────────────────────────────
      - if:
          condition:
            lambda: 'return id(led_mode).current_option() == "Test";'
          then:
            - light.addressable_set:
                id: led_strip
                range_from: 0
                range_to: 10
                color_brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
      # ── CO2 (all 11 LEDs) ────────────────────────────────────────────────
      - if:
          condition:
            lambda: 'return id(led_mode).current_option() == "CO2";'
          then:
            - if:
                condition:
                  lambda: 'return !isnan(id(co2).state);'
                then:
                  - light.addressable_set:
                      id: led_strip
                      color_brightness: !lambda 'return (id(led_brightness).state - id(led_fade).state
                        * 2) / 100.0f;'
                      range_from: 0
                      range_to: 10
                      red: !lambda |-
                        float raw = id(co2).state;
                        float x = (raw < $co2_green) ? raw : $co2_green + floorf((raw - $co2_green) / 50.0f) * 50.0f;
                        return (x < $co2_green) ? 0.0f : (x <= $co2_yellow) ? (x - $co2_green) / ($co2_yellow - $co2_green) : 1.0f;
                      green: !lambda |-
                        float x = id(co2).state;
                        x = (x < $co2_green) ? x : $co2_green + floorf((x - $co2_green) / 50.0f) * 50.0f;
                        if (x < $co2_green)  return 1.0f;
                        if (x < $co2_yellow) return 1.0f - 0.25f * (x - $co2_green) / ($co2_yellow - $co2_green);
                        if (x <= $co2_orange) return 0.75f - 0.25f * (x - $co2_yellow) / ($co2_orange - $co2_yellow);
                        if (x <= $co2_red)    return 0.5f - 0.5f * (x - $co2_orange) / ($co2_red - $co2_orange);
                        return 0.0f;
                      blue: !lambda |-
                        float raw = id(co2).state;
                        float x = (raw < $co2_green) ? raw : $co2_green + floorf((raw - $co2_green) / 50.0f) * 50.0f;
                        return (x < $co2_red) ? 0.0f : (x <= $co2_purple) ? (x - $co2_red) / ($co2_purple - $co2_red) : 1.0f;
                  - light.addressable_set:
                      id: led_strip
                      color_brightness: !lambda 'return (id(led_brightness).state - id(led_fade).state)
                        / 100.0f;'
                      range_from: 1
                      range_to: 9
                      red: !lambda |-
                        float raw = id(co2).state;
                        float x = (raw < $co2_green) ? raw : $co2_green + floorf((raw - $co2_green) / 50.0f) * 50.0f;
                        return (x < $co2_green) ? 0.0f : (x <= $co2_yellow) ? (x - $co2_green) / ($co2_yellow - $co2_green) : 1.0f;
                      green: !lambda |-
                        float x = id(co2).state;
                        x = (x < $co2_green) ? x : $co2_green + floorf((x - $co2_green) / 50.0f) * 50.0f;
                        if (x < $co2_green)  return 1.0f;
                        if (x < $co2_yellow) return 1.0f - 0.25f * (x - $co2_green) / ($co2_yellow - $co2_green);
                        if (x <= $co2_orange) return 0.75f - 0.25f * (x - $co2_yellow) / ($co2_orange - $co2_yellow);
                        if (x <= $co2_red)    return 0.5f - 0.5f * (x - $co2_orange) / ($co2_red - $co2_orange);
                        return 0.0f;
                      blue: !lambda |-
                        float raw = id(co2).state;
                        float x = (raw < $co2_green) ? raw : $co2_green + floorf((raw - $co2_green) / 50.0f) * 50.0f;
                        return (x < $co2_red) ? 0.0f : (x <= $co2_purple) ? (x - $co2_red) / ($co2_purple - $co2_red) : 1.0f;
                  - light.addressable_set:
                      id: led_strip
                      color_brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                      range_from: 5
                      range_to: 5
                      red: !lambda |-
                        float raw = id(co2).state;
                        float x = (raw < $co2_green) ? raw : $co2_green + floorf((raw - $co2_green) / 50.0f) * 50.0f;
                        return (x < $co2_green) ? 0.0f : (x <= $co2_yellow) ? (x - $co2_green) / ($co2_yellow - $co2_green) : 1.0f;
                      green: !lambda |-
                        float x = id(co2).state;
                        x = (x < $co2_green) ? x : $co2_green + floorf((x - $co2_green) / 50.0f) * 50.0f;
                        if (x < $co2_green)  return 1.0f;
                        if (x < $co2_yellow) return 1.0f - 0.25f * (x - $co2_green) / ($co2_yellow - $co2_green);
                        if (x <= $co2_orange) return 0.75f - 0.25f * (x - $co2_yellow) / ($co2_orange - $co2_yellow);
                        if (x <= $co2_red)    return 0.5f - 0.5f * (x - $co2_orange) / ($co2_red - $co2_orange);
                        return 0.0f;
                      blue: !lambda |-
                        float raw = id(co2).state;
                        float x = (raw < $co2_green) ? raw : $co2_green + floorf((raw - $co2_green) / 50.0f) * 50.0f;
                        return (x < $co2_red) ? 0.0f : (x <= $co2_purple) ? (x - $co2_red) / ($co2_purple - $co2_red) : 1.0f;
            - if:
                condition:
                  lambda: 'return isnan(id(co2).state);'
                then:
                  - light.addressable_set:
                      id: led_strip
                      range_from: 0
                      range_to: 10
                      color_brightness: 100%
                      red: 0%
                      green: 0%
                      blue: 0%
      # ── PM2.5 (all 11 LEDs) ──────────────────────────────────────────────
      # Colors use the bar-scale thresholds (0–25 µg/m³, green→purple) and
      # snap at 1.25 µg/m³ boundaries — identical to the PM2.5 Bar mode.
      - if:
          condition:
            lambda: 'return id(led_mode).current_option() == "PM2.5";'
          then:
            - if:
                condition:
                  lambda: 'return !isnan(id(pm_2_5).state);'
                then:
                  - light.addressable_set:
                      id: led_strip
                      color_brightness: !lambda 'return (id(led_brightness).state - id(led_fade).state
                        * 2) / 100.0f;'
                      range_from: 0
                      range_to: 10
                      red: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x <= $pm_2_5_bar_green) return 0.0f;
                        if (x <= $pm_2_5_bar_yellow) return (x - $pm_2_5_bar_green) / ($pm_2_5_bar_yellow - $pm_2_5_bar_green);
                        return 1.0f;
                      green: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x <= $pm_2_5_bar_green)  return 1.0f;
                        if (x < $pm_2_5_bar_yellow)  return 1.0f - 0.25f * (x - $pm_2_5_bar_green) / ($pm_2_5_bar_yellow - $pm_2_5_bar_green);
                        if (x <= $pm_2_5_bar_orange) return 0.75f - 0.25f * (x - $pm_2_5_bar_yellow) / ($pm_2_5_bar_orange - $pm_2_5_bar_yellow);
                        if (x <= $pm_2_5_bar_red)    return 0.5f - 0.5f * (x - $pm_2_5_bar_orange) / ($pm_2_5_bar_red - $pm_2_5_bar_orange);
                        return 0.0f;
                      blue: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x < $pm_2_5_bar_red) return 0.0f;
                        if (x <= $pm_2_5_bar_purple) return (x - $pm_2_5_bar_red) / ($pm_2_5_bar_purple - $pm_2_5_bar_red);
                        return 1.0f;
                  - light.addressable_set:
                      id: led_strip
                      color_brightness: !lambda 'return (id(led_brightness).state - id(led_fade).state)
                        / 100.0f;'
                      range_from: 1
                      range_to: 9
                      red: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x <= $pm_2_5_bar_green) return 0.0f;
                        if (x <= $pm_2_5_bar_yellow) return (x - $pm_2_5_bar_green) / ($pm_2_5_bar_yellow - $pm_2_5_bar_green);
                        return 1.0f;
                      green: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x <= $pm_2_5_bar_green)  return 1.0f;
                        if (x < $pm_2_5_bar_yellow)  return 1.0f - 0.25f * (x - $pm_2_5_bar_green) / ($pm_2_5_bar_yellow - $pm_2_5_bar_green);
                        if (x <= $pm_2_5_bar_orange) return 0.75f - 0.25f * (x - $pm_2_5_bar_yellow) / ($pm_2_5_bar_orange - $pm_2_5_bar_yellow);
                        if (x <= $pm_2_5_bar_red)    return 0.5f - 0.5f * (x - $pm_2_5_bar_orange) / ($pm_2_5_bar_red - $pm_2_5_bar_orange);
                        return 0.0f;
                      blue: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x < $pm_2_5_bar_red) return 0.0f;
                        if (x <= $pm_2_5_bar_purple) return (x - $pm_2_5_bar_red) / ($pm_2_5_bar_purple - $pm_2_5_bar_red);
                        return 1.0f;
                  - light.addressable_set:
                      id: led_strip
                      color_brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                      range_from: 5
                      range_to: 5
                      red: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x <= $pm_2_5_bar_green) return 0.0f;
                        if (x <= $pm_2_5_bar_yellow) return (x - $pm_2_5_bar_green) / ($pm_2_5_bar_yellow - $pm_2_5_bar_green);
                        return 1.0f;
                      green: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x <= $pm_2_5_bar_green)  return 1.0f;
                        if (x < $pm_2_5_bar_yellow)  return 1.0f - 0.25f * (x - $pm_2_5_bar_green) / ($pm_2_5_bar_yellow - $pm_2_5_bar_green);
                        if (x <= $pm_2_5_bar_orange) return 0.75f - 0.25f * (x - $pm_2_5_bar_yellow) / ($pm_2_5_bar_orange - $pm_2_5_bar_yellow);
                        if (x <= $pm_2_5_bar_red)    return 0.5f - 0.5f * (x - $pm_2_5_bar_orange) / ($pm_2_5_bar_red - $pm_2_5_bar_orange);
                        return 0.0f;
                      blue: !lambda |-
                        float x = floorf(std::max(0.0f, id(pm_2_5).state) / 1.25f) * 1.25f;
                        if (x < $pm_2_5_bar_red) return 0.0f;
                        if (x <= $pm_2_5_bar_purple) return (x - $pm_2_5_bar_red) / ($pm_2_5_bar_purple - $pm_2_5_bar_red);
                        return 1.0f;
            - if:
                condition:
                  lambda: 'return isnan(id(pm_2_5).state);'
                then:
                  - light.addressable_set:
                      id: led_strip
                      range_from: 0
                      range_to: 10
                      color_brightness: 100%
                      red: 0%
                      green: 0%
                      blue: 0%
      # ── VOC (all 11 LEDs) ────────────────────────────────────────────────
      - if:
          condition:
            lambda: 'return id(led_mode).current_option() == "VOC";'
          then:
            - if:
                condition:
                  lambda: 'return !isnan(id(voc).state);'
                then:
                  - light.addressable_set:
                      id: led_strip
                      color_brightness: !lambda 'return (id(led_brightness).state - id(led_fade).state
                        * 2) / 100.0f;'
                      range_from: 0
                      range_to: 10
                      red: !lambda |-
                        float raw = id(voc).state;
                        float x = (raw < $voc_green) ? raw : $voc_green + floorf((raw - $voc_green) / 25.0f) * 25.0f;
                        return (x < $voc_green) ? 0.0f : (x <= $voc_yellow) ? (x - $voc_green) / ($voc_yellow - $voc_green) : 1.0f;
                      green: !lambda |-
                        float raw = id(voc).state;
                        float x = (raw < $voc_green) ? raw : $voc_green + floorf((raw - $voc_green) / 25.0f) * 25.0f;
                        if (x < $voc_green)  return 1.0f;
                        if (x < $voc_yellow) return 1.0f - 0.25f * (x - $voc_green) / ($voc_yellow - $voc_green);
                        if (x <= $voc_orange) return 0.75f - 0.25f * (x - $voc_yellow) / ($voc_orange - $voc_yellow);
                        if (x <= $voc_red)    return 0.5f - 0.5f * (x - $voc_orange) / ($voc_red - $voc_orange);
                        return 0.0f;
                      blue: !lambda |-
                        float raw = id(voc).state;
                        float x = (raw < $voc_green) ? raw : $voc_green + floorf((raw - $voc_green) / 25.0f) * 25.0f;
                        return (x < $voc_red) ? 0.0f : (x <= $voc_purple) ? (x - $voc_red) / ($voc_purple - $voc_red) : 1.0f;
                  - light.addressable_set:
                      id: led_strip
                      color_brightness: !lambda 'return (id(led_brightness).state - id(led_fade).state)
                        / 100.0f;'
                      range_from: 1
                      range_to: 9
                      red: !lambda |-
                        float raw = id(voc).state;
                        float x = (raw < $voc_green) ? raw : $voc_green + floorf((raw - $voc_green) / 25.0f) * 25.0f;
                        return (x < $voc_green) ? 0.0f : (x <= $voc_yellow) ? (x - $voc_green) / ($voc_yellow - $voc_green) : 1.0f;
                      green: !lambda |-
                        float raw = id(voc).state;
                        float x = (raw < $voc_green) ? raw : $voc_green + floorf((raw - $voc_green) / 25.0f) * 25.0f;
                        if (x < $voc_green)  return 1.0f;
                        if (x < $voc_yellow) return 1.0f - 0.25f * (x - $voc_green) / ($voc_yellow - $voc_green);
                        if (x <= $voc_orange) return 0.75f - 0.25f * (x - $voc_yellow) / ($voc_orange - $voc_yellow);
                        if (x <= $voc_red)    return 0.5f - 0.5f * (x - $voc_orange) / ($voc_red - $voc_orange);
                        return 0.0f;
                      blue: !lambda |-
                        float raw = id(voc).state;
                        float x = (raw < $voc_green) ? raw : $voc_green + floorf((raw - $voc_green) / 25.0f) * 25.0f;
                        return (x < $voc_red) ? 0.0f : (x <= $voc_purple) ? (x - $voc_red) / ($voc_purple - $voc_red) : 1.0f;
                  - light.addressable_set:
                      id: led_strip
                      color_brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                      range_from: 5
                      range_to: 5
                      red: !lambda |-
                        float raw = id(voc).state;
                        float x = (raw < $voc_green) ? raw : $voc_green + floorf((raw - $voc_green) / 25.0f) * 25.0f;
                        return (x < $voc_green) ? 0.0f : (x <= $voc_yellow) ? (x - $voc_green) / ($voc_yellow - $voc_green) : 1.0f;
                      green: !lambda |-
                        float raw = id(voc).state;
                        float x = (raw < $voc_green) ? raw : $voc_green + floorf((raw - $voc_green) / 25.0f) * 25.0f;
                        if (x < $voc_green)  return 1.0f;
