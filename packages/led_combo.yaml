                      condition:
                        lambda: |-
                          float relative = id(co2).state - 600.0f;
                          int n = std::max(1, std::min(11, 2 + (int)floorf(relative / 100.0f)));
                          float band_pos = relative - floorf(relative / 100.0f) * 100.0f;
                          return n < 11 && band_pos >= 50.0f;
                      then:
                        - light.addressable_set:
                            id: led_strip
                            range_from: !lambda |-
                              int n = std::max(1, std::min(11, 2 + (int)floorf((id(co2).state - 600.0f) / 100.0f)));
                              return 11 - n - 1;
                            range_to: !lambda |-
