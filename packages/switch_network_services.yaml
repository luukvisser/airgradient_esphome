# Config switches to turn off network services that are not needed once the
# device is adopted in Home Assistant (Web Server, Bluetooth, OTA Updates,
# Fallback Hotspot), and an optional Web Password for the web page and REST
# API. Behaviour, caveats and recommendations are documented in
# packages.md (switch_network_services.yaml); keep that the single place for
# user-facing explanations.
#
# Requires `web_server:`, `esp32_ble` (pulled in by `improv_ble:`), a
# `wifi:` with id wifi_client and an `ap:` whose ap_timeout should be
# `${fallback_ap_timeout_ms}ms` (restored by the Fallback Hotspot switch;
# ESPHome offers no getter), an `ota: - platform: esphome` with id
# ota_esphome, and packages/wifi_power_save.yaml
# (apply_wifi_power_save is re-run after Bluetooth toggles).
---
substitutions:
  # Default fallback hotspot delay; the device YAMLs override it with their
  # own value, which they also use for `wifi: ap: ap_timeout:`.
  fallback_ap_timeout_ms: "90000"
  # C++ condition: a switch change is accepted. During setup the restored
  # state is always applied; afterwards Home Assistant must be connected, so
  # the open web page (the only control without HA) cannot flip them.
  network_change_allowed: >-
    (!id(network_services_ready) || (api::global_api_server != nullptr && api::global_api_server->is_connected_with_state_subscription()))
web_server:
  # Build-time placeholder only, never used: apply_web_auth replaces the
  # credentials at boot, before the web server starts. Declaring auth here is
  # what compiles the auth check in and wraps every web handler with it.
  auth:
    username: admin
    password: replaced-at-boot
    type: digest
esphome:
  on_boot:
    # After the restored password global (HARDWARE = 800), before the web
    # server registers its handlers (WIFI - 1 = 249).
    - priority: 600
      then:
        - script.execute: apply_web_auth
    # The OTA Updates switch already set a password when it was restored
    # (priority 798), so OTA is never open. With OTA off, generate it again
    # here: Wi-Fi (250) has started the radio, so esp_random() is truly
    # random now, and the OTA server (200) is not listening yet, so no
    # upload can be mid-authentication when the password changes.
    - priority: 220
      then:
        - if:
            condition:
              switch.is_off: ota_enabled
            then:
              - script.execute: apply_ota_auth
    - priority: -100 # After all components (web server, BLE) are set up.
      then:
        - lambda: id(network_services_ready) = true;
        - script.execute: apply_network_services
globals:
  # Switch actions are ignored until on_boot has run: template switches
  # restore their state during setup, before the web server and BLE exist.
  - id: network_services_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  # Whether this package currently holds the web server's listener reference.
  # init()/deinit() are refcounted (the captive portal shares the listener),
  # so each must be called exactly once per transition.
  - id: web_server_listening
    type: bool
    restore_value: false
    initial_value: 'true'
  # Per-device web password, empty = no auth. Cleared by a factory reset.
  - id: web_password_value
    type: std::string
    restore_value: true
    max_restore_data_length: 64
    initial_value: '""'
script:
  - id: apply_ota_auth
    then:
      - lambda: |-
          if (id(ota_enabled).state) {
            id(ota_esphome).set_auth_password("");
          } else {
            // Random per boot and never shown: plaintext uploads fail
            // authentication. Uploads encrypted with the API key skip it.
            // esp_random() is only truly random once Wi-Fi/BLE runs, hence
            // the second call from on_boot (priority 220).
            char password[33];
            snprintf(password, sizeof(password), "%08" PRIx32 "%08" PRIx32 "%08" PRIx32 "%08" PRIx32,
                     random_uint32(), random_uint32(), random_uint32(), random_uint32());
            id(ota_esphome).set_auth_password(password);
          }
  - id: apply_web_auth
    then:
      - lambda: |-
          // The web server checks credentials from its own task, so it keeps
          // pointers into this fixed buffer rather than into the std::string.
          // strncpy pads with NULs, so a shorter new password clears the rest.
          static char password[65];
          const std::string &value = id(web_password_value);
          strncpy(password, value.c_str(), sizeof(password) - 1);
          auto *base = web_server_base::global_web_server_base;
          base->set_auth_password(password);
          // An empty username disables authentication entirely.
          base->set_auth_username(value.empty() ? "" : "admin");
          id(web_password).publish_state(value.empty() ? "" : "********");
  # The BLE stack shuts down on its next loop after ble.disable; re-apply the
  # Wi-Fi power save mode afterwards in case it did not take effect while
  # Wi-Fi and BLE were sharing the radio.
  - id: reapply_wifi_power_save_later
    mode: restart
    then:
      - delay: 2s
      - script.execute: apply_wifi_power_save
  - id: apply_network_services
    mode: queued
    then:
      # Ignored until on_boot has run (see network_services_ready).
      - if:
          condition:
            lambda: return id(network_services_ready);
          then:
            - lambda: |-
                bool want = id(web_server_enabled).state;
                if (want != id(web_server_listening)) {
                  if (want)
                    web_server_base::global_web_server_base->init();
                  else
                    web_server_base::global_web_server_base->deinit();
                  id(web_server_listening) = want;
                }
                // ap_timeout 0 means the fallback AP is never started
                id(wifi_client).set_ap_timeout(id(fallback_hotspot_enabled).state ? ${fallback_ap_timeout_ms} : 0);
            - if:
                condition:
                  switch.is_on: bluetooth_enabled
                then:
                  - ble.enable:
                else:
                  - ble.disable:
            - script.execute: reapply_wifi_power_save_later
ota:
  - id: !extend ota_esphome
    # Compiles in the password check; apply_ota_auth sets the real value
    # (empty = no password while the OTA Updates switch is on).
    password: ""
switch:
  - platform: template
    id: web_server_enabled
    name: "Web Server"
    icon: mdi:web
    # Turning it off is only accepted while Home Assistant is connected, so
    # the web page (the only control without HA) can never lock itself out.
    # Turning it back on is always allowed.
    optimistic: false
    turn_on_action:
      - switch.template.publish:
          id: web_server_enabled
          state: true
    turn_off_action:
      - lambda: |-
          if (${network_change_allowed})
            id(web_server_enabled).publish_state(false);
          else
            ESP_LOGW("network_services", "Web Server can only be turned off while Home Assistant is connected");
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: grp_system
    on_turn_on:
      - script.execute: apply_network_services
    on_turn_off:
      - script.execute: apply_network_services
  - platform: template
    id: bluetooth_enabled
    name: "Bluetooth"
    icon: mdi:bluetooth
    optimistic: false
    turn_on_action:
      - lambda: |-
          if (${network_change_allowed})
            id(bluetooth_enabled).publish_state(true);
          else
            ESP_LOGW("network_services", "Bluetooth can only be changed while Home Assistant is connected");
    turn_off_action:
      - lambda: |-
          if (${network_change_allowed})
            id(bluetooth_enabled).publish_state(false);
          else
            ESP_LOGW("network_services", "Bluetooth can only be changed while Home Assistant is connected");
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: grp_system
    on_turn_on:
      - script.execute: apply_network_services
    on_turn_off:
      - script.execute: apply_network_services
  - platform: template
    id: ota_enabled
    name: "OTA Updates"
    icon: mdi:upload-network
    optimistic: false
    turn_on_action:
      - lambda: |-
          if (${network_change_allowed})
            id(ota_enabled).publish_state(true);
          else
            ESP_LOGW("network_services", "OTA Updates can only be changed while Home Assistant is connected");
    turn_off_action:
      - lambda: |-
          if (${network_change_allowed})
            id(ota_enabled).publish_state(false);
          else
            ESP_LOGW("network_services", "OTA Updates can only be changed while Home Assistant is connected");
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: grp_system
    on_turn_on:
      - script.execute: apply_ota_auth
    on_turn_off:
      - script.execute: apply_ota_auth
  - platform: template
    id: fallback_hotspot_enabled
    name: "Fallback Hotspot"
    icon: mdi:access-point
    optimistic: false
    turn_on_action:
      - lambda: |-
          if (${network_change_allowed})
            id(fallback_hotspot_enabled).publish_state(true);
          else
            ESP_LOGW("network_services", "Fallback Hotspot can only be changed while Home Assistant is connected");
    turn_off_action:
      - lambda: |-
          if (${network_change_allowed})
            id(fallback_hotspot_enabled).publish_state(false);
          else
            ESP_LOGW("network_services", "Fallback Hotspot can only be changed while Home Assistant is connected");
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: grp_system
    on_turn_on:
      - script.execute: apply_network_services
    on_turn_off:
      - script.execute: apply_network_services
text:
  - platform: template
    id: web_password
    name: "Web Password"
    icon: mdi:form-textbox-password
    mode: password
    min_length: 0
    max_length: 64
    optimistic: false
    entity_category: config
    web_server:
      sorting_group_id: grp_system
    set_action:
      - if:
          condition:
            and:
              - api.connected:
                  state_subscription_only: true
              # Re-submitting the masked placeholder keeps the current password.
              - lambda: return x != "********";
          then:
            - lambda: id(web_password_value) = x;
            - script.execute: apply_web_auth
          else:
            - if:
                condition:
                  not:
                    api.connected:
                      state_subscription_only: true
                then:
                  - logger.log:
                      level: WARN
                      format: "Web Password can only be changed while Home Assistant is connected"
            - script.execute: apply_web_auth
