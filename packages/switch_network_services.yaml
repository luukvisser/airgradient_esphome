# Switches to turn off network services that are not needed once the device
# is adopted in Home Assistant, reducing its attack surface and network noise:
#   - Web Server:       stops the HTTP listener on port 80. Turning it off is
#                       refused unless Home Assistant is connected, so devices
#                       used without HA cannot lock themselves out.
#   - Bluetooth:        stops the BLE stack (used for Improv Wi-Fi provisioning).
#   - OTA Updates:      rejects uploads on the ESPHome OTA port (3232) by
#                       rebooting before any data is written. Firmware updates
#                       via the "Firmware Update" entity (http_request) keep
#                       working.
#   - Fallback Hotspot: no "cleanair" access point + captive portal when Wi-Fi
#                       is lost; the device keeps retrying Wi-Fi instead. First
#                       setup (no Wi-Fi configured yet) is unaffected.
#   - mDNS Discovery:   stops multicast announcements. Home Assistant must then
#                       reach the device by a fixed IP (DHCP reservation).
#                       Turning it back on restarts the device.
#   - Update Check Interval (select): Off / 6 h / 24 h (default) / weekly
#                       manifest checks against GitHub Pages. Manual checks
#                       (HA "update entity" action, config button double-click)
#                       always work.
#
# All switches default to ON so first-time setup is unaffected; their state survives
# reboots. The native API (Home Assistant) is never affected, so everything
# can always be turned back on from there. A factory reset restores defaults.
#
# Requires `web_server:`, `esp32_ble` (pulled in by `esp32_improv:`), an
# `ota: - platform: esphome` with id `ota_esphome`, a `wifi: ap:` and an
# `update:` with id `firmware_update`.
---
substitutions:
  # Must match `wifi: ap: ap_timeout:` in the device YAML; restored when the
  # Fallback Hotspot switch is turned back on.
  fallback_ap_timeout_ms: "90000"
esphome:
  includes:
    - <mdns.h>
  on_boot:
    - priority: -100 # After all components (web server, BLE, mDNS) are set up.
      then:
        - lambda: id(network_services_ready) = true;
        - script.execute: apply_network_services
globals:
  # Switch actions are ignored until on_boot has run: template switches
  # restore their state during setup, before the web server and BLE exist.
  - id: network_services_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  # Whether this package currently holds the web server's listener reference.
  # init()/deinit() are refcounted (the captive portal shares the listener),
  # so each must be called exactly once per transition.
  - id: web_server_listening
    type: bool
    restore_value: false
    initial_value: 'true'
  # mDNS can be stopped at runtime but not restarted (its services are only
  # registered during setup), so re-enabling it reboots the device.
  - id: mdns_running
    type: bool
    restore_value: false
    initial_value: 'true'
  # Update check interval in ms derived from the select; 0 = no automatic check.
  - id: update_check_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
script:
  - id: apply_network_services
    mode: queued
    then:
      # Ignored until on_boot has run (see network_services_ready).
      - if:
          condition:
            lambda: return id(network_services_ready);
          then:
            - lambda: |-
                bool want = id(web_server_enabled).state;
                if (want != id(web_server_listening)) {
                  if (want)
                    web_server_base::global_web_server_base->init();
                  else
                    web_server_base::global_web_server_base->deinit();
                  id(web_server_listening) = want;
                }
                // ap_timeout 0 means the fallback AP is never started
                id(wifi_client).set_ap_timeout(id(fallback_hotspot_enabled).state ? ${fallback_ap_timeout_ms} : 0);
                if (!id(mdns_discovery_enabled).state && id(mdns_running)) {
                  mdns_free();
                  id(mdns_running) = false;
                }
                // Indexes follow the update_check_interval options; 0 = Off.
                static const uint32_t UPDATE_CHECK_MS[] = {0, 6 * 3600000UL, 24 * 3600000UL, 7 * 24 * 3600000UL};
                auto index = id(update_check_interval).active_index();
                id(update_check_ms) = UPDATE_CHECK_MS[index.has_value() ? *index : 2];
            - if:
                condition:
                  switch.is_on: bluetooth_enabled
                then:
                  - ble.enable:
                else:
                  - ble.disable:
            - if:
                condition:
                  lambda: return id(update_check_ms) == 0;
                then:
                  - component.suspend: firmware_update
                else:
                  - component.resume:
                      id: firmware_update
                      update_interval: !lambda return id(update_check_ms);
            - if:
                condition:
                  lambda: return id(mdns_discovery_enabled).state && !id(mdns_running);
                then:
                  - logger.log: "mDNS re-enabled, restarting"
                  - delay: 1s # Let the switch state reach Home Assistant first.
                  - lambda: App.safe_reboot();
ota:
  - id: !extend ota_esphome
    on_begin:
      then:
        - if:
            condition:
              switch.is_off: ota_enabled
            then:
              - logger.log:
                  level: WARN
                  format: "OTA upload rejected: OTA Updates switch is off"
              # on_begin fires before the backend starts writing flash, and
              # the running partition is never touched, so rebooting is safe.
              - lambda: App.safe_reboot();
switch:
  - platform: template
    id: web_server_enabled
    name: "Web Server"
    icon: mdi:web
    # Not optimistic: turning it off is only accepted while Home Assistant is
    # connected, so the web page (the only control without HA) can never lock
    # itself out. During setup the restored state is always accepted.
    optimistic: false
    turn_on_action:
      - switch.template.publish:
          id: web_server_enabled
          state: true
    turn_off_action:
      - if:
          condition:
            or:
              - lambda: return !id(network_services_ready);
              - api.connected:
                  state_subscription_only: true
          then:
            - switch.template.publish:
                id: web_server_enabled
                state: false
          else:
            - logger.log:
                level: WARN
                format: "Web Server can only be turned off while Home Assistant is connected"
            - switch.template.publish:
                id: web_server_enabled
                state: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: grp_system
    on_turn_on:
      - script.execute: apply_network_services
    on_turn_off:
      - script.execute: apply_network_services
  - platform: template
    id: bluetooth_enabled
    name: "Bluetooth"
    icon: mdi:bluetooth
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: grp_system
    on_turn_on:
      - script.execute: apply_network_services
    on_turn_off:
      - script.execute: apply_network_services
  - platform: template
    id: ota_enabled
    name: "OTA Updates"
    icon: mdi:upload-network
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: grp_system
  - platform: template
    id: fallback_hotspot_enabled
    name: "Fallback Hotspot"
    icon: mdi:access-point
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: grp_system
    on_turn_on:
      - script.execute: apply_network_services
    on_turn_off:
      - script.execute: apply_network_services
  - platform: template
    id: mdns_discovery_enabled
    name: "mDNS Discovery"
    icon: mdi:radar
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: grp_system
    on_turn_on:
      - script.execute: apply_network_services
    on_turn_off:
      - script.execute: apply_network_services
select:
  # Option order must match the index lookup in apply_network_services.
  - platform: template
    id: update_check_interval
    name: "Update Check Interval"
    icon: mdi:update
    options:
      - "Off"
      - "Every 6 hours"
      - "Every 24 hours"
      - "Weekly"
    initial_option: "Every 24 hours"
    optimistic: true
    restore_value: true
    entity_category: config
    web_server:
      sorting_group_id: grp_system
    on_value:
      - script.execute: apply_network_services
