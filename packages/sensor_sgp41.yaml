# Sensirion SGP41 MOX sensor — VOC index and NOx index (0–500 scale).
# Uses on-chip algorithm with SHT40 temp/humidity compensation. Configurable learning time offsets.
# Depends on: I2C bus (from board package), temp + humidity sensors (from sensor_sht40 package).
---
esphome:
  on_boot:
    # The sgp4x component only hands tuning parameters to the Sensirion
    # algorithm inside its own setup() (setup priority DATA = 600). Higher
    # priorities run first, so this must sit between the restored globals
    # (HARDWARE = 800) and the sensor setup (600). Changing a select later only
    # takes effect at the next restart (re-running setup() is not safe).
    - priority: 700
      then:
        - lambda: |-
            // All parameters are Sensirion defaults except learning_time_offset_hours (user-configurable).
            // Ref: Sensirion Gas Index Algorithm Application Note
            // https://sensirion.com/media/documents/02232963/6294E210/Info_Note_SGP_Gas_Index_Algorithm.pdf
            //
            // set_voc_algorithm_tuning(index_offset=100, learning_time_offset_hours,
            //   learning_time_gain_hours=12, gating_max_duration_minutes=180, std_initial=50, gain_factor=230)
            id(sgp4x_sensor).set_voc_algorithm_tuning(100, (uint16_t)id(g_voc_learning_time), 12, 180, 50, 230);
            // set_nox_algorithm_tuning(index_offset=1, learning_time_offset_hours,
            //   learning_time_gain_hours=12, gating_max_duration_minutes=720, gain_factor=230)
            id(sgp4x_sensor).set_nox_algorithm_tuning(1, (uint16_t)id(g_nox_learning_time), 12, 720, 230);
globals:
  - id: g_voc_learning_time
    type: int
    restore_value: true
    initial_value: '24'
  - id: g_nox_learning_time
    type: int
    restore_value: true
    initial_value: '24'
sensor:
  - platform: sgp4x
    id: sgp4x_sensor
    # SGP41 https://esphome.io/components/sensor/sgp4x.html
    voc_index:
      name: "VOC index"
      id: voc
      icon: mdi:molecule
      filters:
        - throttle: 30s
      web_server:
        sorting_group_id: grp_sensors
    nox_index:
      name: "NOx index"
      id: nox
      icon: mdi:molecule
      filters:
        - throttle: 30s
      web_server:
        sorting_group_id: grp_sensors
    compensation: # Remove this block if no temp/humidity sensor present for compensation
      temperature_source: temp
      humidity_source: humidity
select:
  - platform: template
    name: "SGP41 VOC Learning Time Offset"
    id: voc_learning_time_offset
    # Option labels are days; set_action parses the leading number and converts
    # to Sensirion's learning_time_offset_hours (× 24). Applied at the next boot.
    options: ["0.5 days", "1 day", "7 days", "14 days", "30 days"]
    initial_option: "1 day"
    restore_value: true
    optimistic: true
    entity_category: config
    icon: "mdi:clock-outline"
    web_server:
      sorting_group_id: grp_voc
    set_action:
      - globals.set:
          id: g_voc_learning_time
          value: !lambda 'return (int)(atof(x.c_str()) * 24);'
      - logger.log:
          level: WARN
          format: "SGP41 VOC learning time offset changed; restart the device to apply it"
  - platform: template
    name: "SGP41 NOx Learning Time Offset"
    id: nox_learning_time_offset
    # Option labels are days; set_action parses the leading number and converts
    # to Sensirion's learning_time_offset_hours (× 24). Applied at the next boot.
    options: ["0.5 days", "1 day", "7 days", "14 days", "30 days"]
    initial_option: "1 day"
    restore_value: true
    optimistic: true
    entity_category: config
    icon: "mdi:clock-outline"
    web_server:
      sorting_group_id: grp_voc
    set_action:
      - globals.set:
          id: g_nox_learning_time
          value: !lambda 'return (int)(atof(x.c_str()) * 24);'
      - logger.log:
          level: WARN
          format: "SGP41 NOx learning time offset changed; restart the device to apply it"
