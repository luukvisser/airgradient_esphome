# AirGradient ONE - Board v9
# https://www.airgradient.com/open-airgradient/instructions/overview/
#
# This configuration targets the "Made for ESPHome" program:
# https://esphome.io/guides/made_for_esphome/
#
# Release workflow:
#   - Update `config_version` and `esphome.project.version` below.
#   - Tag the commit as `airgradient-one/v<version>` (the slug before /v
#     must match the filename / devices.yaml slug).
#   - CI validates, builds, publishes the manifest under /airgradient-one/
#     on GitHub Pages, and attaches binaries to a GitHub Release.
---
substitutions:
  config_version: "1.8.0" # keep in sync with esphome.project.version below
esphome:
  name: "airgradient-one"
  friendly_name: "AG ONE"
  name_add_mac_suffix: true
  # `project.name` must be globally unique and stable: devices keyed on it
  # for update checks and Home Assistant adoption. Use reverse-domain +
  # the device slug so multiple products from the same org don't collide.
  project:
    name: "luukvisser.airgradient-one"
    version: "1.8.0"
logger:
api:
  # Encrypt the native API link to Home Assistant (Noise, ChaCha20-Poly1305).
  # No key is set here on purpose: these prebuilt firmwares are shared by every
  # device, so a baked-in key would be identical everywhere. The device boots
  # unprovisioned, and the first client to connect (Home Assistant on adoption)
  # sets a per-device key, which is stored in flash. From then on only
  # encrypted connections are accepted; only a factory reset clears the key.
  encryption: {}
  # Room for Home Assistant plus a dashboard/log viewer; a misbehaving client
  # on the network cannot exhaust the slots Home Assistant needs.
  max_connections: 3
  # Reboot only after an hour without any API client (default 15 min), so
  # Home Assistant restarts/maintenance do not reboot every sensor.
  reboot_timeout: 1h
# Fall back to the minimal recovery firmware after 5 failed boots instead of
# the default 10, so a bad update recovers sooner.
safe_mode:
  num_attempts: 5
# Provisioning window: a device that is not fully set up yet (no Wi-Fi, or no
# API encryption key from Home Assistant) only accepts Wi-Fi credentials and an
# API key for 15 minutes after power-on. This stops another client on the
# network from setting the key before Home Assistant does. Power-cycle the
# device to reopen the window.
provisioning:
  timeout: 15min
ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request
http_request:
  id: http_request_client
  # Verify both hosts against our own trust list instead of the public CA
  # bundle: hw.airgradient.com uses AirGradient's private root CA (in no
  # public store), luukvisser.github.io a Let's Encrypt chain. The bundle
  # pins the AirGradient root plus the public roots GitHub Pages may use;
  # see packages/certs/ca_bundle.pem for fingerprints and upkeep.
  verify_ssl: true
  ca_certificate_path: packages/certs/ca_bundle.pem
  timeout: 10s
  buffer_size_rx: 2048
update:
  - platform: http_request
    id: firmware_update
    name: "Firmware Update"
    # Per-device manifest URL. Must match the Pages path the release
    # workflow publishes to (site/<slug>/manifest.json).
    source: "https://luukvisser.github.io/airgradient_esphome/airgradient-one/manifest.json"
    # Default; overridden at runtime by the Update Check Interval select.
    update_interval: 24h
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_system
wifi:
  id: wifi_client
  fast_connect: false
  # Keep the modem fully awake. The ESP32 default (WIFI_PS_MIN_MODEM) sleeps
  # the radio between beacons, which drops/delays packets and stalls the
  # once-a-minute AirGradient upload — a cause of the dashboard's "no
  # measurements for 30 min" gaps. Devices are mains-powered, so the extra
  # draw is irrelevant.
  power_save_mode: none
  ap:
    ap_timeout: 90s
    password: "cleanair"
captive_portal:
  id: captive_portal_web
esp32_improv:
  id: improv_ble
  authorizer: none
improv_serial:
  id: improv_serial_provisioner
web_server:
  version: 3
  port: 80
  sorting_groups:
    - id: grp_sensors
      name: "Sensors"
      sorting_weight: 5
    - id: grp_led
      name: "LED"
      sorting_weight: 10
    - id: grp_display
      name: "Display"
      sorting_weight: 20
    - id: grp_co2
      name: "CO₂ (SenseAir S8)"
      sorting_weight: 30
    - id: grp_pm25
      name: "PM2.5 (PMS5003)"
      sorting_weight: 40
    - id: grp_temp
      name: "Temperature & Humidity (SHT40)"
      sorting_weight: 50
    - id: grp_voc
      name: "VOC / NOx (SGP41)"
      sorting_weight: 60
    - id: grp_system
      name: "System"
      sorting_weight: 70
dashboard_import:
  # Per-device import URL. The @main ref means users always adopt the
  # latest version of the config from the default branch; switch to a
  # tag (e.g. @airgradient-one/v1.0.0) if you want adoption pinned.
  package_import_url: "github://luukvisser/airgradient_esphome/airgradient-one.yaml@main"
  import_full_config: true
packages:
  # ── Hardware ────────────────────────────────────────────────────────────
  board: !include packages/airgradient_esp32-c3_board.yaml
  # ── Sensors ─────────────────────────────────────────────────────────────
  pm_2.5: !include packages/sensor_pms5003.yaml
  co2: !include packages/sensor_s8.yaml
  temp_humidity: !include packages/sensor_sht40.yaml
  tvoc: !include packages/sensor_sgp41.yaml
  wifi: !include packages/sensor_wifi.yaml
  uptime: !include packages/sensor_uptime.yaml
  go_iaqs: !include packages/sensor_go_iaqs.yaml
  # ── Display & indicators ────────────────────────────────────────────────
  display: !include packages/display_sh1106_multi_page.yaml
  led: !include packages/led.yaml
  led_combo: !include packages/led_combo.yaml
  # ── Integrations ────────────────────────────────────────────────────────
  airgradient_api: !include packages/airgradient_api_esp32-c3.yaml
  network_services: !include packages/switch_network_services.yaml
  time: !include packages/time_homeassistant.yaml
  # ── System utilities ────────────────────────────────────────────────────
  diagnostic_esp32: !include packages/diagnostic_esp32.yaml
  hardware_watchdog: !include packages/watchdog.yaml
  button_factory_reset: !include packages/button_factory_reset.yaml
  captive_portal: !include packages/captive_portal.yaml
  config_button: !include packages/config_button.yaml
